spring.application.name=vanguardERP

spring.datasource.url=jdbc:postgresql://localhost:5432/vanguarderp_db?reWriteBatchedInserts=true&autoreconnect=true
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.platform=postgres
spring.datasource.dbcp2.pool-prepared-statements=true
spring.datasource.dbcp2.max-open-prepared-statements=450
spring.jpa.hibernate.ddl-auto=update

server.servlet.context-path=/vanguard-erp


spring.security.user.name=admin
spring.security.user.password=admin